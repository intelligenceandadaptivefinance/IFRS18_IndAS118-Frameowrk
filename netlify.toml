# Static site. No build step, no dependencies to install, nothing to break on deploy.
[build]
  publish = "."
  command = ""

# Cache the vendored library hard; keep the app and data revalidating so a
# rule-library correction reaches users on their next visit.
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
